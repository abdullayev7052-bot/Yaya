<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaya — Boshqaruv</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="center" hidden>
  <form id="loginForm" class="card narrow">
    <div id="brandLogin" class="brand"><h1>Yaya</h1></div>
    <label>Login <input name="login" required autocomplete="username"></label>
    <label>Parol <input name="password" type="password" required autocomplete="current-password"></label>
    <button>Kirish</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="main" hidden>
  <header>
    <a href="#dashboard" id="brandHead" class="brand"><b>Yaya</b></a>
    <nav id="nav"></nav>
    <span class="role" id="whoami"></span>
    <button class="ghost" id="logout">Chiqish</button>
  </header>
  <p id="flash" hidden></p>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
